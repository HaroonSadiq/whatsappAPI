<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — WhatsApp Support Platform</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --teal: #075E54; --green: #25D366; --bg: #0f1117;
      --card: #1a1d27; --border: #2e3248; --text: #e8eaf6;
      --muted: #7c83a8; --red: #ff5c5c; --radius: 14px;
    }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 40px 36px; width: 100%; max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }
    .logo {
      display: flex; align-items: center; justify-content: center;
      gap: 12px; margin-bottom: 32px;
    }
    .logo-icon {
      width: 48px; height: 48px; border-radius: 50%;
      background: linear-gradient(135deg, var(--teal), var(--green));
      display: flex; align-items: center; justify-content: center;
    }
    .logo-icon svg { width: 26px; height: 26px; fill: #fff; }
    .logo-text { font-size: 1.15rem; font-weight: 700; }
    .logo-sub  { font-size: .72rem; color: var(--muted); }
    h2 { text-align: center; font-size: 1.1rem; margin-bottom: 28px; color: var(--muted); font-weight: 400; }
    label { display: block; font-size: .78rem; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .05em; }
    input {
      width: 100%; background: #111318; border: 1px solid var(--border);
      border-radius: 8px; padding: 11px 14px; color: var(--text); font-size: .9rem;
      outline: none; transition: border-color .15s;
    }
    input:focus { border-color: var(--green); }
    .field { margin-bottom: 18px; }
    .btn {
      width: 100%; padding: 12px; border-radius: 9px; border: none; cursor: pointer;
      font-size: .92rem; font-weight: 700; background: var(--green); color: #fff;
      transition: opacity .15s; margin-top: 6px;
    }
    .btn:hover { opacity: .9; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .error {
      background: rgba(255,92,92,.1); border: 1px solid var(--red);
      border-radius: 8px; padding: 10px 14px; font-size: .82rem;
      color: var(--red); margin-bottom: 18px; display: none;
    }
    .hint { text-align: center; font-size: .75rem; color: var(--muted); margin-top: 18px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
        </svg>
      </div>
      <div>
        <div class="logo-text">WhatsApp Router</div>
        <div class="logo-sub">Support Platform</div>
      </div>
    </div>

    <h2>Sign in to your account</h2>
    <div class="error" id="err"></div>

    <form id="form">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" type="text" placeholder="Enter username" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Enter password" autocomplete="current-password" required />
      </div>
      <button class="btn" id="btn" type="submit">Sign In</button>
    </form>

    <p class="hint">Default admin: <strong>admin</strong> / <strong>admin123</strong></p>
  </div>

  <script>
    const form = document.getElementById('form');
    const errEl = document.getElementById('err');
    const btn   = document.getElementById('btn');

    // If already logged in, redirect
    const token = localStorage.getItem('wa_token');
    const user  = JSON.parse(localStorage.getItem('wa_user') || 'null');
    if (token && user) {
      window.location.href = user.role === 'admin' ? '/' : '/agent';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Signing in…';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res  = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed');

        localStorage.setItem('wa_token', data.token);
        localStorage.setItem('wa_user',  JSON.stringify(data.user));

        window.location.href = data.user.role === 'admin' ? '/' : '/agent';
      } catch (err) {
        errEl.textContent    = err.message;
        errEl.style.display  = 'block';
        btn.disabled         = false;
        btn.textContent      = 'Sign In';
      }
    });
  </script>
</body>
</html>
