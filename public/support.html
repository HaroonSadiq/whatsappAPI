<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Support Chat</title>
  <style>
    :root { --bg:#0f1117; --card:#1a1d27; --border:#2e3248; --text:#e8eaf6; --muted:#7c83a8; --green:#25D366; --blue:#4f8ef7; --red:#ff5c5c; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; flex-direction:column; }
    header { background:var(--card); border-bottom:1px solid var(--border); padding:14px 18px; display:flex; align-items:center; justify-content:space-between; }
    .brand { font-weight:700; font-size:1rem; color:var(--green); }
    .status { font-size:.75rem; color:var(--muted); }
    .chat { flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:10px; }
    .msg { max-width:80%; padding:10px 14px; border-radius:14px; font-size:.9rem; line-height:1.45; word-wrap:break-word; }
    .msg.system { align-self:center; background:rgba(124,131,168,.15); color:var(--muted); font-size:.78rem; border-radius:10px; max-width:92%; }
    .msg.customer { align-self:flex-end; background:var(--green); color:#000; border-bottom-right-radius:4px; }
    .msg.agent { align-self:flex-start; background:var(--card); border:1px solid var(--border); border-bottom-left-radius:4px; }
    .meta { font-size:.65rem; color:var(--muted); margin-top:4px; }
    .composer { background:var(--card); border-top:1px solid var(--border); padding:12px 16px; display:flex; gap:10px; }
    .composer input { flex:1; background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:10px 14px; color:var(--text); font-size:.9rem; outline:none; }
    .composer input:focus { border-color:var(--green); }
    .composer button { background:var(--green); color:#000; border:none; border-radius:10px; padding:0 18px; font-weight:700; cursor:pointer; }
    .composer button:disabled { opacity:.5; cursor:not-allowed; }
    .banner { padding:10px 16px; font-size:.8rem; text-align:center; }
    .banner.waiting { background:rgba(246,201,14,.12); color:#f6c90e; }
    .banner.active { background:rgba(37,211,102,.12); color:var(--green); }
    .banner.closed { background:rgba(255,92,92,.12); color:var(--red); }
    .empty { text-align:center; color:var(--muted); padding:40px 20px; font-size:.85rem; }
    .link { color:var(--blue); text-decoration:underline; cursor:pointer; }
  </style>
</head>
<body>
<header>
  <div class="brand">Support Chat</div>
  <div class="status" id="status-text">Connecting…</div>
</header>

<div class="banner waiting" id="banner">Waiting for an agent to join…</div>

<div class="chat" id="chat">
  <div class="empty" id="empty">Messages will appear here once an agent joins.</div>
</div>

<div class="composer" id="composer">
  <input id="input" type="text" placeholder="Type a message…" autocomplete="off" disabled />
  <button id="send" disabled>Send</button>
</div>

<script>
  const params = new URLSearchParams(location.search);
  const sessionId = params.get("session");
  if (!sessionId) { document.body.innerHTML = '<div class="banner closed">Invalid or missing session.</div>'; }

  const chat = document.getElementById("chat");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const banner = document.getElementById("banner");
  const statusText = document.getElementById("status-text");
  let composerEnabled = false;

  function appendMsg(msg) {
    document.getElementById("empty")?.remove();
    const div = document.createElement("div");
    div.className = `msg ${msg.direction}`;
    const time = new Date(msg.ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    div.innerHTML = `<div>${escapeHtml(msg.text)}</div><div class="meta">${time}</div>`;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function escapeHtml(t) {
    return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function setStatus(state, reason) {
    if (state === "waiting") {
      banner.className = "banner waiting";
      banner.textContent = "Waiting for an agent to join…";
      statusText.textContent = "Waiting";
      composerEnabled = false;
    } else if (state === "active") {
      banner.className = "banner active";
      banner.textContent = "Agent is now chatting with you.";
      statusText.textContent = "Active";
      composerEnabled = true;
    } else if (state === "closed") {
      banner.className = "banner closed";
      banner.textContent = "This session has ended." + (reason ? " Reason: " + reason : "");
      statusText.textContent = "Closed";
      composerEnabled = false;
    }
    input.disabled = !composerEnabled;
    sendBtn.disabled = !composerEnabled;
  }

  async function loadHistory() {
    try {
      const r = await fetch(`/api/test/session/${sessionId}/messages`);
      if (!r.ok) { banner.textContent = "Session not found or expired."; return; }
      const data = await r.json();
      setStatus(data.session.status, data.session.closed_reason);
      if (data.messages.length) document.getElementById("empty")?.remove();
      data.messages.forEach(appendMsg);
    } catch (e) {
      banner.textContent = "Error loading session.";
    }
  }

  async function postMessage() {
    const text = input.value.trim();
    if (!text || !composerEnabled) return;
    input.value = "";
    try {
      const r = await fetch(`/api/test/session/${sessionId}/message`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text })
      });
      if (!r.ok) { const d = await r.json(); banner.textContent = d.error || "Failed to send"; }
    } catch (e) {
      banner.textContent = "Network error. Retrying…";
    }
  }

  sendBtn.addEventListener("click", postMessage);
  input.addEventListener("keydown", e => { if (e.key === "Enter") postMessage(); });

  // SSE
  const es = new EventSource(`/api/test/session/${sessionId}/stream`);
  es.addEventListener("connected", () => { statusText.textContent = statusText.textContent.replace("Connecting", "Connected"); });
  es.onmessage = (ev) => {
    const data = JSON.parse(ev.data);
    if (data.event === "new_message") {
      appendMsg(data.msg);
    } else if (data.event === "agent_joined") {
      setStatus("active");
      appendMsg({ direction: "system", text: `Agent ${data.agent_name} has joined the session.`, ts: new Date().toISOString() });
    } else if (data.event === "session_closed") {
      setStatus("closed", data.reason);
      appendMsg({ direction: "system", text: "The support session has been closed.", ts: new Date().toISOString() });
      es.close();
    }
  };
  es.onerror = () => { statusText.textContent = "Reconnecting…"; };

  loadHistory();
</script>
</body>
</html>
